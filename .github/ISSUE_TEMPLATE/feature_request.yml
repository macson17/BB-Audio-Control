name: Request a feature (English)
description: Suggest an idea or improvement for BB Audio Control
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. Please describe the problem or use case first,
        followed by your proposed solution.

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem should be solved?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: How could the requested feature look or work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Is there an existing workaround?
