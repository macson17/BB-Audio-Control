name: Report a bug (English)
description: Report a reproducible problem with BB Audio Control
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not include pairing codes, real IP
        addresses, computer names, user paths, or other personal data.

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: For example, 0.9.9
    validations:
      required: true

  - type: dropdown
    id: tablet
    attributes:
      label: Tablet
      options:
        - iPad
        - Android tablet
        - Other device
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, browser, and relevant audio hardware — without personal data.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed pairing codes, real IP addresses, computer names, and user paths.
          required: true
